name: SSH Build

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup web terminal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttyd curl

      - name: Start ttyd + cloudflare tunnel
        run: |
          # Start web terminal on port 7681
          ttyd -p 7681 -c runner:twrp123 bash &
          sleep 2
          
          # Install cloudflared
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          
          # Create tunnel
          cloudflared tunnel --url http://localhost:7681 2>&1 &
          sleep 10
          
          echo ""
          echo "Open the https://xxxx.trycloudflare.com URL above in your browser"
          echo "Login: runner / twrp123"
          echo "Then run build commands in the terminal"
          while true; do sleep 60; done
