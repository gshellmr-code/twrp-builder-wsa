name: SSH Build

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup SSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          echo "runner:twrp123" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config
          sudo ssh-keygen -A
          sudo service ssh start

      - name: Start SSH tunnel via bore
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          bore local 22 --to bore.pub 2>&1 &
          sleep 10
          echo ""
          echo "Copy the SSH command from above and paste in PowerShell"
          while true; do sleep 60; done
