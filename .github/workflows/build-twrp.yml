name: Build TWRP x86_64 for WSA

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-14.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "CYBER-BUDDY"
          git config --global user.email "gshellmr-code@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ github.event.inputs.manifest_branch || 'twrp-14.1' }}
        id: pwd

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch aosp_x86_64-eng
          make clean
          make recoveryimage -j$(nproc --all) 2>&1 | tee build.log
          echo "Build exit code: $?"
        continue-on-error: true

      - name: Locate Output Files
        run: |
          cd workspace
          echo "=== Product dirs ==="
          ls out/target/product/ 2>/dev/null || echo "No product dir"
          echo ""
          for d in out/target/product/*/; do
            echo "=== $d ==="
            ls "$d"ramdisk-recovery* "$d"recovery.img 2>/dev/null || echo "  no recovery files"
          done
          echo ""
          echo "=== Build log tail ==="
          tail -80 build.log 2>/dev/null || echo "No build log"
        continue-on-error: true

      - name: Extract ramdisk
        run: |
          cd workspace
          PRODUCT=$(find out/target/product -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "Product: $PRODUCT"
          mkdir -p /tmp/ramdisk
          
          if [ -f "$PRODUCT/ramdisk-recovery.img" ]; then
            echo "Extracting ramdisk-recovery.img..."
            cd /tmp/ramdisk
            cpio -idm < $GITHUB_WORKSPACE/workspace/$PRODUCT/ramdisk-recovery.img
          elif [ -f "$PRODUCT/recovery.img" ]; then
            echo "Extracting recovery.img (Android boot image format)..."
            python3 -c "
          import struct, gzip, os
          with open('$GITHUB_WORKSPACE/workspace/$PRODUCT/recovery.img', 'rb') as f:
              data = f.read()
          if data[:8] == b'ANDROID!':
              ksize = struct.unpack('<I', data[8:12])[0]
              rsize = struct.unpack('<I', data[16:20])[0]
              page = struct.unpack('<I', data[36:40])[0]
              roff = page + ((ksize + page - 1) // page) * page
              rdata = data[roff:roff + rsize]
              if rdata[:2] == b'\x1f\x8b':
                  rdata = gzip.decompress(rdata)
              os.makedirs('/tmp/ramdisk', exist_ok=True)
              with open('/tmp/ramdisk.img', 'wb') as f:
                  f.write(rdata)
          "
            cd /tmp/ramdisk
            cpio -idm < /tmp/ramdisk.img
          else
            echo "No recovery image found. Checking build log..."
            tail -100 workspace/build.log 2>/dev/null
          fi
        continue-on-error: true

      - name: Compile dispatcher (init)
        run: |
          sudo apt-get install -y musl-tools
          if [ -f /tmp/ramdisk/sbin/twrp ] || [ -f /tmp/ramdisk/sbin/recovery ]; then
            musl-gcc -static -o /tmp/ramdisk/init \
              $GITHUB_WORKSPACE/init.c
            echo "Dispatcher compiled"
          else
            echo "No TWRP binary found, creating minimal init"
            echo '#!/sbin/sh' > /tmp/ramdisk/init
            echo 'exec /sbin/sh' >> /tmp/ramdisk/init
            chmod +x /tmp/ramdisk/init
          fi
          file /tmp/ramdisk/init

      - name: Inject info.json and patch.json
        run: |
          cp $GITHUB_WORKSPACE/info.json /tmp/ramdisk/info.json
          cp $GITHUB_WORKSPACE/patch.json /tmp/ramdisk/patch.json

      - name: Verify x86_64
        run: |
          echo "=== Files ==="
          ls -la /tmp/ramdisk/
          echo ""
          echo "=== TWRP binary ==="
          file /tmp/ramdisk/sbin/twrp 2>/dev/null || echo "twrp not found at /sbin/twrp"
          file /tmp/ramdisk/sbin/recovery 2>/dev/null || echo "recovery not found"
          echo ""
          echo "=== Linker ==="
          file /tmp/ramdisk/sbin/linker64 2>/dev/null || echo "linker64 not found"
          echo ""
          echo "=== GUI resources ==="
          ls -la /tmp/ramdisk/twres/ 2>/dev/null || echo "twres not found"
          ls -la /tmp/ramdisk/res/ 2>/dev/null || echo "res not found"
          echo ""
          echo "=== init ==="
          file /tmp/ramdisk/init
          echo ""
          echo "=== info.json ==="
          cat /tmp/ramdisk/info.json

      - name: Package twrp.7z
        run: |
          cd /tmp/ramdisk
          7z a /tmp/twrp.7z .
          ls -la /tmp/twrp.7z

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/twrp.7z
          name: "twrp-x86_64-wsa-${{ github.run_id }}"
          tag_name: "build-${{ github.run_id }}"
          body: |
            TWRP x86_64 for WSA
            
            Build: ${{ github.run_id }}
            Manifest: ${{ github.event.inputs.manifest_branch || 'twrp-14.1' }}
            
            **Instructions:**
            1. Download twrp.7z
            2. Use twrp.py --inject twrp.7z to inject into WSA initrd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-x86_64-wsa
          path: /tmp/twrp.7z
          retention-days: 30
