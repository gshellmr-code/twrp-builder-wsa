name: Build TWRP x86_64 for WSA

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-14.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "CYBER-BUDDY"
          git config --global user.email "gshellmr-code@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ github.event.inputs.manifest_branch || 'twrp-14.1' }}

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync

      - name: Create x86_64 emulator device tree
        run: |
          cd workspace
          mkdir -p device/emulator/twrpx8664

          cat > device/emulator/twrpx8664/AndroidProducts.mk << 'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_twrpx8664.mk
          COMMON_LUNCH_CHOICES := \
              omni_twrpx8664-ap2a-userdebug
          EOF

          cat > device/emulator/twrpx8664/omni_twrpx8664.mk << 'EOF'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_base.mk)
          PRODUCT_NAME := omni_twrpx8664
          PRODUCT_DEVICE := twrpx8664
          PRODUCT_BRAND := generic
          PRODUCT_MODEL := TWRP x86_64
          PRODUCT_RELEASE_NAME := ap2a
          EOF

          cat > device/emulator/twrpx8664/BoardConfig.mk << 'EOF'
          TARGET_ARCH := x86_64
          TARGET_ARCH_VARIANT := x86_64
          TARGET_CPU_ABI := x86_64
          TARGET_BOARD_PLATFORM := goldfish
          TARGET_NO_KERNEL := false
          TARGET_NO_RECOVERY := false
          BOARD_KERNEL_IMAGE_NAME := bzImage
          BOARD_USES_MKE2FS := true
          TARGET_2ND_ARCH := x86
          TARGET_2ND_CPU_ABI := x86
          TARGET_RELEASE := ap2a
          EOF

          cat > device/emulator/twrpx8664/device.mk << 'EOF'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/x86_64.mk)
          PRODUCT_NAME := omni_twrpx8664
          PRODUCT_DEVICE := twrpx8664
          EOF

          rm -f device/emulator/twrpx8664/vendorsetup.sh

          echo "=== Device tree created ==="
          ls -la device/emulator/twrpx8664/

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_twrpx8664-ap2a-userdebug
          make clean
          make recoveryimage -j$(nproc --all) 2>&1 | tee build.log
          echo "Build exit code: $?"
          echo ""
          echo "=== Build log tail ==="
          tail -50 build.log

      - name: Find and package output
        run: |
          cd workspace
          mkdir -p /tmp/ramdisk
          
          PRODUCT=$(find out/target/product -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          echo "Product dir: $PRODUCT"
          
          if [ -n "$PRODUCT" ]; then
            ls -la "$PRODUCT"/ 2>/dev/null | head -30
            echo ""
            echo "=== Recovery files ==="
            find "$PRODUCT" -maxdepth 1 \( -name "ramdisk-recovery*" -o -name "recovery.img" -o -name "*.img" \) 2>/dev/null
            
            if [ -f "$PRODUCT/ramdisk-recovery.img" ]; then
              echo "Extracting ramdisk-recovery.img..."
              cpio -idm < "$PRODUCT/ramdisk-recovery.img"
            elif [ -f "$PRODUCT/recovery.img" ]; then
              echo "Extracting recovery.img..."
              python3 << 'PYEOF'
          import struct, gzip, os
          with open("RECOVERY_IMG", 'rb') as f:
              data = f.read()
          if data[:8] == b'ANDROID!':
              ksize = struct.unpack('<I', data[8:12])[0]
              rsize = struct.unpack('<I', data[16:20])[0]
              page = struct.unpack('<I', data[36:40])[0]
              roff = page + ((ksize + page - 1) // page) * page
              rdata = data[roff:roff + rsize]
              if rdata[:2] == b'\x1f\x8b':
                  rdata = gzip.decompress(rdata)
              os.makedirs('/tmp/ramdisk', exist_ok=True)
              with open('/tmp/ramdisk.img', 'wb') as f:
                  f.write(rdata)
          PYEOF
              cd /tmp/ramdisk
              cpio -idm < /tmp/ramdisk.img
            fi
          fi
          
          echo ""
          echo "=== Ramdisk contents ==="
          ls -la /tmp/ramdisk/ 2>/dev/null || echo "Empty"
          ls -la /tmp/ramdisk/sbin/ 2>/dev/null || echo "No sbin"
          ls -la /tmp/ramdisk/twres/ 2>/dev/null || echo "No twres"
        env:
          RECOVERY_IMG: ${{ github.workspace }}/workspace/${{ steps.find.outputs.product }}/recovery.img

      - name: Compile dispatcher (init)
        run: |
          sudo apt-get install -y musl-tools
          if [ -f /tmp/ramdisk/sbin/twrp ] || [ -f /tmp/ramdisk/sbin/recovery ]; then
            musl-gcc -static -o /tmp/ramdisk/init \
              $GITHUB_WORKSPACE/init.c
            echo "Dispatcher compiled"
          else
            echo "No TWRP binary found, creating fallback init"
            printf '#!/sbin/sh\nexec /sbin/sh\n' > /tmp/ramdisk/init
            chmod +x /tmp/ramdisk/init
          fi
          file /tmp/ramdisk/init

      - name: Inject info.json and patch.json
        run: |
          cp $GITHUB_WORKSPACE/info.json /tmp/ramdisk/info.json
          cp $GITHUB_WORKSPACE/patch.json /tmp/ramdisk/patch.json

      - name: Verify
        run: |
          echo "=== All files ==="
          find /tmp/ramdisk -type f | head -50
          echo ""
          echo "=== TWRP binary ==="
          file /tmp/ramdisk/sbin/twrp 2>/dev/null || echo "twrp not found"
          file /tmp/ramdisk/sbin/recovery 2>/dev/null || echo "recovery not found"
          echo ""
          echo "=== info.json ==="
          cat /tmp/ramdisk/info.json

      - name: Package twrp.7z
        run: |
          cd /tmp/ramdisk
          7z a /tmp/twrp.7z .
          ls -la /tmp/twrp.7z

      - name: Create twrp.img (cpio archive)
        run: |
          cd /tmp/ramdisk
          find . -print0 | cpio -o -0 -H newc 2>/dev/null > /tmp/twrp.img || \
          find . | cpio -o -H newc 2>/dev/null > /tmp/twrp.img
          ls -la /tmp/twrp.img

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/twrp.7z
            /tmp/twrp.img
          name: "twrp-x86_64-wsa-${{ github.run_id }}"
          tag_name: "build-${{ github.run_id }}"
          body: |
            TWRP x86_64 for WSA
            
            Build: ${{ github.run_id }}
            Manifest: ${{ github.event.inputs.manifest_branch || 'twrp-14.1' }}
            
            **Files:**
            - twrp.7z — TWRP ramdisk files for twrp.py --inject
            - twrp.img — Raw cpio ramdisk image
            
            **Usage:**
            ```
            twrp.py --inject twrp.7z
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-x86_64-wsa
          path: |
            /tmp/twrp.7z
            /tmp/twrp.img
          retention-days: 30
